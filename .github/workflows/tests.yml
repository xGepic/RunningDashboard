# Tests the backend and the frontend on every push to a branch and every pull request; the Release workflow runs it
# too before it builds the apps. Both measure code coverage: the run's summary page shows it for each side, and each
# side's HTML report is attached to the run as an artifact (backend-coverage, frontend-coverage).
name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

# A newer push to a branch, or to a pull request, cancels the run still going for the older commit. Called from the
# Release workflow (whose event is workflow_dispatch), each run has a group of its own, so a push never cancels a
# release's tests.
concurrency:
  group: tests-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # The tests run on Linux: cheaper than Windows, and closer to the Mac the app also runs on.
  test-backend:
    name: Test the backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The tests with coverage, as locally; the report lands in backend/coverage.
      - shell: pwsh
        run: ./backend/coverage.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

  test-frontend:
    name: Test the frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The HTML report and Cobertura results land in frontend/coverage/frontend. Only the default reporter: in GitHub
      # Actions, Vitest would otherwise add its own test report to the run's summary page.
      - run: >-
          npm test -- --watch=false --reporters=default --coverage
          --coverage-reporters=html --coverage-reporters=text-summary --coverage-reporters=cobertura

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend
          retention-days: 14

  coverage:
    name: Sum up coverage
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      # For ReportGenerator, a local tool in backend/dotnet-tools.json.
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v8
        with:
          pattern: '*-coverage'
          path: coverage

      - working-directory: backend
        run: |
          dotnet tool restore
          summarise() {
            dotnet reportgenerator "-reports:$1" "-targetdir:../coverage/summary-$2" -reporttypes:MarkdownSummaryGithub > /dev/null
            # A heading of our own instead of ReportGenerator's "Summary - …" and "Coverage", and "Totals" for its
            # table; the free edition also names a figure it leaves out, so that line goes too.
            {
              echo "## $3"
              grep -v -e '^# Summary' -e '^## Coverage$' -e 'only available for sponsors' "../coverage/summary-$2/SummaryGithub.md" |
                sed 's|<summary>Summary</summary>|<summary>Totals</summary>|'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          summarise ../coverage/backend-coverage/Cobertura.xml backend 'Backend coverage'
          summarise ../coverage/frontend-coverage/cobertura-coverage.xml frontend 'Frontend coverage'
