# Runs the Tests workflow, builds the packaged apps with publish.ps1 and, for a version tag (git tag v1.0.0 && git push
# origin v1.0.0), attaches them to a GitHub Release for friends to download. Run by hand (Actions → Release → Run
# workflow), it only builds them and keeps them as the run's artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build the apps
    needs: tests
    # publish.ps1 builds the Windows and the Mac app on Windows; the Mac one comes out signed and executable.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - shell: pwsh
        run: ./publish.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: RunningDashboard
          path: |
            deploy/RunningDashboard-win.zip
            deploy/RunningDashboard-mac.tar.gz

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: RunningDashboard

      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          RunningDashboard-win.zip RunningDashboard-mac.tar.gz
          --repo "$GITHUB_REPOSITORY"
          --title "Running Dashboard $GITHUB_REF_NAME" --generate-notes
