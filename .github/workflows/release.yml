# Tests everything, builds the packaged apps with publish.ps1 and, for a version tag (git tag v1.0.0 && git push origin
# v1.0.0), attaches them to a GitHub Release for friends to download. Run by hand (Actions → Release → Run workflow),
# it only builds them and keeps them as the run's artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # publish.ps1 builds the Windows and the Mac app on Windows; the Mac one comes out signed and executable.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test the backend
        run: dotnet test backend -c Release

      - name: Test the frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false

      - name: Build the apps
        shell: pwsh
        run: ./publish.ps1

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          deploy/RunningDashboard-win.zip deploy/RunningDashboard-mac.tar.gz
          --title "Running Dashboard $env:GITHUB_REF_NAME" --generate-notes

      - name: Keep the apps
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: RunningDashboard
          path: |
            deploy/RunningDashboard-win.zip
            deploy/RunningDashboard-mac.tar.gz
