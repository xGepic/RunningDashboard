# Run by hand (Actions → Release → Run workflow): runs the Tests workflow, builds the packaged apps with publish.ps1
# and attaches them to the GitHub Release "latest" for friends to download, replacing the one before. Its downloads
# keep their links: https://github.com/<owner>/<repo>/releases/latest/download/RunningDashboard-win.zip
name: Release

on:
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  build:
    name: Build the apps
    needs: tests
    # publish.ps1 builds the Windows and the Mac app on Windows; the Mac one comes out signed and executable.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - shell: pwsh
        run: ./publish.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: RunningDashboard
          path: |
            deploy/RunningDashboard-win.zip
            deploy/RunningDashboard-mac.tar.gz

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: RunningDashboard

      # The previous "latest" goes, its tag too, so the new one is tagged on the commit that was just built.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest RunningDashboard-win.zip RunningDashboard-mac.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Running Dashboard" \
            --notes "Built $(date -u '+%Y-%m-%d %H:%M') UTC from ${GITHUB_SHA::7} on $GITHUB_REF_NAME."
