@if (review.error()) {
  <p class="error" role="alert">The review of {{ year() }} could not be loaded.</p>
} @else if (review.value(); as review) {
  @if (downloadFailed()) {
    <p class="error" role="alert">The image could not be made.</p>
  }
  <app-year-review-content [review]="review" [months]="months()" />
}

@if (image(); as image) {
  <div class="image-stage" aria-hidden="true">
    <div class="image" #image [style.width.px]="image.width">
      <app-year-review-content [review]="image.review" [months]="months()" [athleteName]="image.athleteName" forImage />
    </div>
  </div>
}
