@if (review.error()) {
  <p class="error" role="alert">The review of {{ year() }} could not be loaded.</p>
} @else if (review.value(); as review) {
  @if (downloadFailed()) {
    <p class="error" role="alert">The image could not be made.</p>
  }
  <app-year-review-content [review]="review" [months]="months()" />
  @if (story(); as playing) {
    @defer (on immediate) {
      <app-year-story [review]="review" [months]="months()" [athleteName]="playing.athleteName"
                      (closed)="story.set(null)" (download)="downloadImage()" />
    }
  }
}

@if (imageSource(); as source) {
  <div class="image-stage" aria-hidden="true">
    <div class="image" #imageElement [style.width.px]="source.width">
      <app-year-review-content [review]="source.review" [months]="months()" [athleteName]="source.athleteName" forImage />
    </div>
  </div>
}
